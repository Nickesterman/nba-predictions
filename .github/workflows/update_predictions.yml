name: Update Weekly NBA Predictions

on:
  schedule:
    - cron: "0 6 * * MON"  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger in the GitHub UI
  push:
    paths:
      - "train_model.py"
      - "nba_model_2025_26.py"
      - "requirements.txt"
      - ".github/workflows/update_predictions.yml"

permissions:
  contents: write  # allow committing the refreshed CSV

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # If your model reads API keys (odds providers etc.), expose them like this:
      # - name: Export secrets to environment
      #   run: |
      #     echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV

      - name: Run training script
        run: python train_model.py

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_predictions.csv
          git diff --quiet && echo "No changes to commit" || git commit -m "🔄 Auto-update weekly predictions"
          git push
