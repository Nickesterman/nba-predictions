name: Update Weekly NBA Predictions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # allow the workflow to push commits

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Australia/Sydney   # timestamps in logs/files use Sydney time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training script
        run: |
          python train_model.py

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly_predictions.csv predictions_history.csv nba_model.pkl || true
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "🔄 Weekly predictions update"
          # Only push if there was a commit (avoids failing when no changes)
          git diff --cached --quiet || git push
